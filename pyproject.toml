[project]
name = "vla-experiments"
version = "0.1.0"
description = "Shared uv environment for the repository's self-contained VLA experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "base-smolvla-cost-curve",
  "goal-prompts-in-seen-hosts",
  "goal-scene-seen-prompts",
  "seen-scene-goal-prompts-v2",
  "seen-article-drop",
  "seen-prompts-in-goal-scene",
  "seen-semantic-paraphrases",
  "analyst-curve-baseline",
  "pretrain-smolvla-few-shot-tune-low-k",
  "pretrain-smolvla-low-k-action-steps",
  "pretrain-smolvla-naive-baseline-few-shot-tune",
  "pretrain-smolvla-prompt-only-2",
  "pretrain-smolvla-prompt-only-3",
  "smolvla-pretrain-libero",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
base-smolvla-cost-curve = { workspace = true }
goal-prompts-in-seen-hosts = { workspace = true }
goal-scene-seen-prompts = { workspace = true }
seen-scene-goal-prompts-v2 = { workspace = true }
seen-article-drop = { workspace = true }
seen-prompts-in-goal-scene = { workspace = true }
seen-semantic-paraphrases = { workspace = true }
analyst-curve-baseline = { workspace = true }
pretrain-smolvla-few-shot-tune-low-k = { workspace = true }
pretrain-smolvla-low-k-action-steps = { workspace = true }
pretrain-smolvla-naive-baseline-few-shot-tune = { workspace = true }
pretrain-smolvla-prompt-only-2 = { workspace = true }
pretrain-smolvla-prompt-only-3 = { workspace = true }
smolvla-pretrain-libero = { workspace = true }

[tool.uv.workspace]
members = [
  "experiments/*",
]
