[project]
name = "vla-experiments"
version = "0.1.0"
description = "Shared uv environment for the repository's self-contained VLA experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "smolvla-action-steps",
  "smolvla-prompt-only",
  "vla-cost-curve",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
smolvla-action-steps = { workspace = true }
smolvla-prompt-only = { workspace = true }
vla-cost-curve = { workspace = true }

[tool.uv.workspace]
members = [
  "experiments/*",
]
