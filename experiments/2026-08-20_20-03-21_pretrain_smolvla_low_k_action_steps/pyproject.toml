[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-smolvla-low-k-action-steps"
version = "0.1.0"
description = "Low-k SmolVLA action replanning screen at n_action_steps 1, 10, and 25"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lowk-action-steps-prepare = "pretrain_smolvla_low_k_action_steps.prepare:main"
lowk-action-steps-selection = "pretrain_smolvla_low_k_action_steps.selection:main"
lowk-action-steps-dataset-smoke = "pretrain_smolvla_low_k_action_steps.dataset_smoke:main"
lowk-action-steps-audit = "pretrain_smolvla_low_k_action_steps.audit:main"
lowk-action-steps-train = "pretrain_smolvla_low_k_action_steps.training:main"
lowk-action-steps-evaluate = "pretrain_smolvla_low_k_action_steps.evaluate:main"
lowk-action-steps-determinism = "pretrain_smolvla_low_k_action_steps.determinism:main"
lowk-action-steps-orchestrate = "pretrain_smolvla_low_k_action_steps.orchestrate:main"
lowk-action-steps-aggregate = "pretrain_smolvla_low_k_action_steps.aggregate:main"
lowk-action-steps-trackio = "pretrain_smolvla_low_k_action_steps.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
