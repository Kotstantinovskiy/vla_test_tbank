[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-smolvla-few-shot-tune-low-k"
version = "0.1.0"
description = "Few-shot cost curve (k=5/10/25) on the official-data SmolVLA pretrain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
few-shot-lowk-prepare = "pretrain_few_shot_low_k.prepare:main"
few-shot-lowk-selection = "pretrain_few_shot_low_k.selection:main"
few-shot-lowk-audit = "pretrain_few_shot_low_k.audit:main"
few-shot-lowk-train = "pretrain_few_shot_low_k.training:main"
few-shot-lowk-evaluate = "pretrain_few_shot_low_k.evaluate:main"
few-shot-lowk-orchestrate = "pretrain_few_shot_low_k.orchestrate:main"
few-shot-lowk-aggregate = "pretrain_few_shot_low_k.aggregate:main"
few-shot-lowk-trackio = "pretrain_few_shot_low_k.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
