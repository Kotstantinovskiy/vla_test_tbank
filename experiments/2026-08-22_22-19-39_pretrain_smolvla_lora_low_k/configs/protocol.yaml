  model_safetensors_sha256: 0a410cc6887e71c0dd2d21dd8a5deb7aba66e291dba9acba8656320dc076a3cc
  seen_positive_control: "libero_90 task 0: 20/20"
  zero_shot_reference: "2026-08-19_pretrain_smolvla_prompt_only_3: true 1/200"
  vlm_backbone_revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
  vlm_model_safetensors_sha256: b9bfd456c9472c0acd5719d6e514c4b859891af205ee1a736552fd3497b8b0c3
  offline_runtime_view: >-
    artifacts/runtime_base_checkpoint symlinks the canonical weights and
    patches only config.vlm_model_name and the tokenizer processor to the
    pinned local backbone; canonical checkpoint files remain unchanged.

libero_assets:
  repo: lerobot/libero-assets
  revision: 0b3ea86be5fe169d0fd036ae63d1070ec09e90f6

target_demos:
  dataset: official/libero_goal_rot180_128
  root: /var/tmp/vla_libero_official_rot180/libero_goal
  source_repo: yifengzhu-hf/LIBERO-datasets
  source_revision: f13aa24a3da8c43c7225569f28c562979fa0e35a
  selection: first k episodes for the named task, asserted as official demo_0..demo_{k-1}

adaptation:
  budgets: [1, 2, 3]
  independence: every task/budget starts from the declared base checkpoint
  method: >-
    LoRA adapters on the VLM plus full training of the action expert and
    projections, via lerobot 0.6.1's native PEFT integration (peft 0.20.0).
  lora:
    method_type: LORA
    r: 16
    lora_alpha: 32
    dropout: 0 (peft default lora_dropout=0.0; no stochastic layers train)
    target_modules: >-
      every used VLM linear: text layers 0-14 (q/k/v/o + gate/up/down),
      all 12 vision-encoder layers (q/k/v/out + fc1/fc2), connector
      projection.  The guard text layer 15, norms, embeddings, and lm_head
      get no adapters.
  full_training_modules: >-
    PEFT modules_to_save: the whole lm_expert (bare LlamaModel; its lm_head
    does not exist inside lm_expert) and the five projection modules -- the
    exact trainable set of the expert-only baseline.
  merge: >-
    after training, the adapter is merged into the pinned base weights and
    saved as a plain SmolVLA checkpoint (pretrained_model_merged); processor
    pipelines carrying target-dataset normalization statistics are copied
    from the training checkpoint.  Evaluation consumes only merged
    checkpoints; the merge asserts protocol rank/targets and that target
    weights actually changed.
  optimizer: >-
    unchanged SmolVLA training preset (AdamW lr 1e-4, cosine warmup
    1000 / decay 30000), applied to adapters and full-training copies.
  steps: 2000
  batch_size: 32
  seed: 1000
  precision: fp32
  chunk_size: 50
  n_action_steps: 50
  num_workers: 32
  normalizer_disclosure: >-
    LeRobot replaces checkpoint normalization statistics with target-dataset
    statistics for k>0. The k=0 reference and k>0 points therefore use
    different normalizers.

evaluation:
  suite: libero_goal
  tasks: [0, 1, 2]
  scope: the three held-out assignment tasks named in PROBLEM.md
  action_steps: [50, 25]
  action_steps_note: >-
    every merged checkpoint is evaluated at inference n_action_steps=50 and
    25; the override is applied at load time only. 18 evaluation points.
  episodes_per_point: 20
  batch_size: 1
  horizon: 300
  environment_seed: 1000 + episode_index
  policy_noise_seed: 1000 + episode_index
  libero_init_state_id: episode_index
  noise_protocol: reset torch and all CUDA RNGs immediately before each single-episode eval_policy call
  init_state_protocol: set LIBERO init_state_id immediately before each single-episode eval_policy call
  determinism_gate: >-
    replay task 0 / k=1 in reverse episode order at every action-steps
    variant (50 and 25) and require identical per-episode init-state IDs,
    seeds, outcomes, and rewards
  videos: all episodes are retained
  seed_parity: >-
    identical to the expert-only deterministic repro and the full-FT
    experiment (training seed 1000; env/noise seed banks 1000..1019; init
    states 0..19), so per-point comparisons across all three methods are
    paired.

known_limitations:
  single_adaptation_seed: >-
    This run has one training seed (1000); the assignment's two-seed
    requirement remains outstanding.
  lora_hyperparameters_not_swept: >-
    r=16 / alpha=32 is a single point chosen a priori; a worse-than-full-FT
    result confounds "low-rank is insufficient" with "these hyperparameters
    are suboptimal".
  peft_dependency: peft 0.20.0 was added to the workspace for this experiment.

