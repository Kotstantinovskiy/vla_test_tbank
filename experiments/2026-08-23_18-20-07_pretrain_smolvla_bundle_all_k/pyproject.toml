[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-smolvla-bundle-all-k"
version = "0.1.0"
description = "Bundle recipe (full FT + state noise + image aug) cost curve k=1..25"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bundle-allk-prepare = "pretrain_smolvla_bundle_all_k.prepare:main"
bundle-allk-selection = "pretrain_smolvla_bundle_all_k.selection:main"
bundle-allk-dataset-smoke = "pretrain_smolvla_bundle_all_k.dataset_smoke:main"
bundle-allk-audit = "pretrain_smolvla_bundle_all_k.audit:main"
bundle-allk-train = "pretrain_smolvla_bundle_all_k.training:main"
bundle-allk-evaluate = "pretrain_smolvla_bundle_all_k.evaluate:main"
bundle-allk-determinism = "pretrain_smolvla_bundle_all_k.determinism:main"
bundle-allk-orchestrate = "pretrain_smolvla_bundle_all_k.orchestrate:main"
bundle-allk-aggregate = "pretrain_smolvla_bundle_all_k.aggregate:main"
bundle-allk-trackio = "pretrain_smolvla_bundle_all_k.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
