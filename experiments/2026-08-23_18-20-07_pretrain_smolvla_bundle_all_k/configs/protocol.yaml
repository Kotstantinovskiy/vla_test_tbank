experiment: pretrain_smolvla_bundle_all_k
created_at: 2026-08-23T18:20:07+03:00
compares_against:
  expert_only_low_k: 2026-08-21_20-37-56_pretrain_smolvla_low_k_deterministic_repro (k=1/2/3)
  expert_only_naive: 2026-08-21_20-37-56_pretrain_smolvla_naive_deterministic_repro (k=5/10/25)
  full_ft: 2026-08-22_18-10-40_pretrain_smolvla_full_ft_low_k (k=1/2/3)
  image_aug: 2026-08-23_00-18-49_pretrain_smolvla_image_aug_low_k (k=1/2/3)
  state_noise: 2026-08-22_22-43-55_pretrain_smolvla_state_noise_k1 and
    2026-08-23_14-31-07_pretrain_smolvla_state_noise_k1_1k_steps (k=1)
motivation: >-
  Compile the ingredients that helped in the single-ingredient experiments
  into one recipe and measure the full cost curve k=1..25: full fine-tune
  (largest single win: k=2 0.683->0.950), state noise alpha=0.10 (best k=1:
  0.600->0.700 at 1000 steps), lerobot default image transforms (robustness
  to re-planning; neutral-to-positive means), and budget-dependent steps
  (k=1 at 1000 steps matched 2000).  The combination is untested -- that is
  the experiment.

base_checkpoint:
  path: /var/tmp/vla_outputs/seen_libero90_official_20260817/checkpoints/030000/pretrained_model
  model_safetensors_sha256: 0a410cc6887e71c0dd2d21dd8a5deb7aba66e291dba9acba8656320dc076a3cc
  vlm_backbone_revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
  vlm_model_safetensors_sha256: b9bfd456c9472c0acd5719d6e514c4b859891af205ee1a736552fd3497b8b0c3
  offline_runtime_view: >-
    artifacts/runtime_base_checkpoint symlinks the canonical weights and
    patches only config.vlm_model_name and the tokenizer processor to the
    pinned local backbone.

libero_assets:
  repo: lerobot/libero-assets
  revision: 0b3ea86be5fe169d0fd036ae63d1070ec09e90f6

target_demos:
  dataset: official/libero_goal_rot180_128
  root: /var/tmp/vla_libero_official_rot180/libero_goal
  source_repo: yifengzhu-hf/LIBERO-datasets
  source_revision: f13aa24a3da8c43c7225569f28c562979fa0e35a
  selection: first k episodes for the named task, asserted as official demo_0..demo_{k-1}

adaptation:
  budgets: [1, 2, 3, 5, 10, 25]
  independence: every task/budget starts from the declared base checkpoint
  recipe:
    trainable: full fine-tune (train_expert_only=false, freeze_vision_encoder=false,
      train_state_proj=true; only lerobot's guard tensors stay frozen)
    image_transforms: lerobot 0.6.1 defaults enabled verbatim (ColorJitter
      brightness/contrast 0.8-1.2, saturation 0.5-1.5, hue ±0.05;
      SharpnessJitter 0.5-1.5; RandomAffine ±5°/5% translate; up to 3 per
      frame, both cameras; invariant test pins the library defaults)
    state_noise: alpha=0.10 Gaussian on the normalized observation.state in
      policy.forward, training only, dedicated RNG stream seed 91000 (main
      training RNG untouched); applied uniformly at every budget
    steps_by_budget: {1: 1000, 2: 1500, 3: 2000, 5: 2000, 10: 2000, 25: 2000}
    optimizer: SmolVLA preset (AdamW lr 1e-4; auto-scaled warmup/decay per steps)
  batch_size: 32
  seed: 1000
  precision: fp32
  chunk_size: 50
  n_action_steps: 50
  num_workers: 16
  normalizer_disclosure: >-
    LeRobot replaces checkpoint normalization statistics with target-dataset
    statistics for k>0; identical to the sibling experiments.

evaluation:
  suite: libero_goal
  tasks: [0, 1, 2]
  scope: the three held-out assignment tasks named in PROBLEM.md
  action_steps: [50, 35, 25]
  action_steps_note: >-
    every adapted checkpoint is evaluated cleanly (no augmentation, no
    noise) at inference n_action_steps=50, 35, and 25 -- 54 evaluation
    points, 18 training jobs.
  episodes_per_point: 20
  batch_size: 1
  horizon: 300
  environment_seed: 1000 + episode_index
  policy_noise_seed: 1000 + episode_index
  libero_init_state_id: episode_index
  noise_protocol: reset torch and all CUDA RNGs immediately before each single-episode eval_policy call
  init_state_protocol: set LIBERO init_state_id immediately before each single-episode eval_policy call
  determinism_gate: >-
    replay task 0 / k=1 in reverse episode order at all three action-steps
    variants (run concurrently on separate GPUs) and require identical
    per-episode init-state IDs, seeds, outcomes, and rewards
  videos: all episodes are retained
  seed_parity: >-
    identical to every sibling experiment (training seed 1000; env/noise
    banks 1000..1019; init states 0..19), so all cross-experiment
    comparisons are paired per episode.

scheduling:
  design: >-
    slot-based orchestrator: per GPU, TRAIN_SLOTS_PER_GPU=2 concurrent
    trainings and EVAL_SLOTS_PER_GPU=2 concurrent evaluations (a full-FT
    training holds ~30 GB, an evaluation ~12 GB on 144 GB cards).
    Evaluations are dispatched the moment their checkpoint completes and
    overlap remaining trainings; drained training workers convert to
    evaluation workers.  Shorter jobs are scheduled first.  Overridable via
    VLA_GPU_IDS / VLA_TRAIN_SLOTS / VLA_EVAL_SLOTS.
  gpus: [1, 2, 3]

known_limitations:
  single_adaptation_seed: one training seed (1000); two-seed requirement outstanding.
  bundled_attribution: >-
    the bundle changes several ingredients at once relative to any single
    reference; per-ingredient attribution rests on the single-ingredient
    experiments, and interactions are only measured as the bundle-vs-best-
    single difference.
  noise_untested_beyond_k1: >-
    state noise alpha=0.10 was validated only at k=1; applying it uniformly
    at k>=2 is an extrapolation the bundle deliberately tests.
  concurrency_throughput: >-
    concurrent jobs share GPU SMs and CPU decode workers; per-job step time
    degrades relative to exclusive runs.  This affects wall-clock only, not
    results.

