[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-smolvla-prompt-only-3"
version = "0.1.0"
description = "Prompt-only zero-shot redo with reproducible per-episode policy sampling noise"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prompt-only-3-prepare = "pretrain_smolvla_prompt_only_3.prepare:main"
prompt-only-3-evaluate = "pretrain_smolvla_prompt_only_3.evaluate:main"
prompt-only-3-orchestrate = "pretrain_smolvla_prompt_only_3.orchestrate:main"
prompt-only-3-aggregate = "pretrain_smolvla_prompt_only_3.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
