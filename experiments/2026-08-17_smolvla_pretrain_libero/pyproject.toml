[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-pretrain-libero"
version = "0.1.0"
description = "SmolVLA LIBERO pretraining and adaptation data converted directly from official HDF5"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "h5py>=3.11",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smolvla-pretrain-libero-convert = "smolvla_pretrain_libero.convert:main"
smolvla-pretrain-libero-verify = "smolvla_pretrain_libero.verify_conversion:main"
smolvla-pretrain-libero-prepare = "smolvla_pretrain_libero.prepare:main"
smolvla-pretrain-libero-seen-control = "smolvla_pretrain_libero.eval_seen_control:main"
smolvla-pretrain-libero-summarize = "smolvla_pretrain_libero.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
