[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-smolvla-cost-curve"
version = "0.1.0"
description = "Ablation: few-shot cost curve from plain smolvla_base (no libero_90 pretrain)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
base-curve-prepare = "base_smolvla_cost_curve.prepare:main"
base-curve-train = "base_smolvla_cost_curve.training:main"
base-curve-evaluate = "base_smolvla_cost_curve.evaluate:main"
base-curve-orchestrate = "base_smolvla_cost_curve.orchestrate:main"
base-curve-aggregate = "base_smolvla_cost_curve.aggregate:main"
base-curve-audit = "base_smolvla_cost_curve.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
