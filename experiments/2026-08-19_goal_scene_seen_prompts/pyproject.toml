[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-scene-seen-prompts"
version = "0.1.0"
description = "Probe 3: frozen pretrain in the GOAL scene under seen-trained prompt strings; predicate success + behavioral metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
  "marimo>=0.13",
  "plotly>=5.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
goal-seen-prepare = "goal_scene_seen_prompts.prepare:main"
goal-seen-evaluate = "goal_scene_seen_prompts.evaluate:main"
goal-seen-orchestrate = "goal_scene_seen_prompts.orchestrate:main"
goal-seen-aggregate = "goal_scene_seen_prompts.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
