[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seen-scene-goal-prompts-v2"
version = "0.1.0"
description = "v2 language probes: prompted-task predicate success, full goal-prompt slice, no absent block"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
  "marimo>=0.13",
  "plotly>=5.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seen-prompts-v2-prepare = "seen_scene_goal_prompts_v2.prepare:main"
seen-prompts-v2-evaluate = "seen_scene_goal_prompts_v2.evaluate:main"
seen-prompts-v2-orchestrate = "seen_scene_goal_prompts_v2.orchestrate:main"
seen-prompts-v2-aggregate = "seen_scene_goal_prompts_v2.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
