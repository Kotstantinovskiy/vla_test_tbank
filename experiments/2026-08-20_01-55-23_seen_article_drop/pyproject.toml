[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seen-article-drop"
version = "0.1.0"
description = "Single article deletion robustness on ten LIBERO-90 tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seen-article-drop-prepare = "seen_article_drop.prepare:main"
seen-article-drop-evaluate = "seen_article_drop.evaluate:main"
seen-article-drop-determinism = "seen_article_drop.determinism:main"
seen-article-drop-orchestrate = "seen_article_drop.orchestrate:main"
seen-article-drop-aggregate = "seen_article_drop.aggregate:main"
seen-article-drop-trackio = "seen_article_drop.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
