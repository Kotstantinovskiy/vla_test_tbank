experiment: smolvla_action_steps_sweep
date: 2026-08-15
hypothesis: inference_replanning_reduces_compounding_error
inference:
  n_action_steps: [1, 5, 10, 25, 50]
  checkpoint_default: 50
  chunk_size: 50
  weights_modified: false
evaluation:
  seed: 1000
  episodes_per_point: 20
  batch_size: 4
  target_suite: libero_goal
  target_task_ids: [0, 1, 2]
  demo_budgets: [0, 5, 10, 25]
  prompt: environment_instruction
  video_episodes_per_point: 1
language_controls:
  policy: run_wrong_and_nonsense_only_if_any_true_prompt_zero_shot_success_is_nonzero
  wrong: cyclic_next_target
  nonsense: "perform the dax florp twice"
zero_shot_checkpoint:
  repo_id: crislmfroes/smolvla-libero-90
  revision: 418f9d0e5b48585bcee1e1a7d47e302629af78da
adapted_checkpoints:
  root: artifacts/checkpoints/naive
  training_step: 2000
  demo_budgets: [5, 10, 25]
tracking:
  backend: trackio
  project: smolvla-action-steps-sweep
  local_dir: artifacts/trackio
