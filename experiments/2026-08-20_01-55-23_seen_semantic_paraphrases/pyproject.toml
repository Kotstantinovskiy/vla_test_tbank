[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seen-semantic-paraphrases"
version = "0.1.0"
description = "Meaning-preserving paraphrase robustness on ten LIBERO-90 tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seen-semantic-paraphrases-prepare = "seen_semantic_paraphrases.prepare:main"
seen-semantic-paraphrases-evaluate = "seen_semantic_paraphrases.evaluate:main"
seen-semantic-paraphrases-determinism = "seen_semantic_paraphrases.determinism:main"
seen-semantic-paraphrases-orchestrate = "seen_semantic_paraphrases.orchestrate:main"
seen-semantic-paraphrases-aggregate = "seen_semantic_paraphrases.aggregate:main"
seen-semantic-paraphrases-trackio = "seen_semantic_paraphrases.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
