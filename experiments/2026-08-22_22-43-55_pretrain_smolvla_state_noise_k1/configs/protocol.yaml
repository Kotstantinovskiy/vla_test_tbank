experiment: pretrain_smolvla_state_noise_k1
created_at: 2026-08-22T22:43:55+03:00
compares_against:
  full_ft_k1: 2026-08-22_18-10-40_pretrain_smolvla_full_ft_low_k (k=1, n=50)
motivation: >-
  Proprioception-shift robustness (cf. "Adapt Your Body: Mitigating
  Proprioception Shifts in Imitation Learning", 2025; AugInsert): at k=1 the
  policy sees a single trajectory of arm states and may bind actions to
  millimeter-exact proprioception; training-time Gaussian noise on the state
  asserts that behavior should be locally constant around demonstrated states.

base_checkpoint:
  path: /var/tmp/vla_outputs/seen_libero90_official_20260817/checkpoints/030000/pretrained_model
  model_safetensors_sha256: 0a410cc6887e71c0dd2d21dd8a5deb7aba66e291dba9acba8656320dc076a3cc
  vlm_backbone_revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
  vlm_model_safetensors_sha256: b9bfd456c9472c0acd5719d6e514c4b859891af205ee1a736552fd3497b8b0c3
  offline_runtime_view: >-
    artifacts/runtime_base_checkpoint symlinks the canonical weights and
    patches only config.vlm_model_name and the tokenizer processor to the
    pinned local backbone.

libero_assets:
  repo: lerobot/libero-assets
  revision: 0b3ea86be5fe169d0fd036ae63d1070ec09e90f6

target_demos:
  dataset: official/libero_goal_rot180_128
  root: /var/tmp/vla_libero_official_rot180/libero_goal
  source_repo: yifengzhu-hf/LIBERO-datasets
  source_revision: f13aa24a3da8c43c7225569f28c562979fa0e35a
  selection: official demo_0 of each task (k=1 only)

adaptation:
  demo_budget: 1
  grid: alphas [0.00, 0.01, 0.03, 0.05] x tasks [0, 1, 2] = 12 training jobs
  independence: every (task, alpha) starts from the declared base checkpoint
  recipe: >-
    full fine-tune identical to the full-FT experiment
    (train_expert_only=false, freeze_vision_encoder=false,
    train_state_proj=true; AdamW preset lr 1e-4; 2000 steps; batch 32; fp32;
    seed 1000; num_workers 32).
  augmentation:
    what: additive zero-mean Gaussian noise on proprioception, training only
    where: >-
      batch["observation.state"] inside policy.forward, i.e. AFTER the
      MEAN_STD normalizer; s_tilde = s + alpha * eps with eps ~ N(0, I).
      Because STATE normalization is MEAN_STD over the k=1 training demo,
      alpha equals sigma_i = alpha * Std(s_i) per dimension in raw units.
    untouched: ground-truth actions, images, language, evaluation rollouts
    rng: >-
      dedicated torch.Generator seeded with 91000 per job; the main training
      RNG stream is not consumed, so the alpha=0.00 arm (no wrapper at all)
      re-runs the full-FT k=1 recipe bit-for-bit up to GPU nondeterminism.
    implementation: >-
      in-process wrapper around lerobot.scripts.lerobot_train.train with
      make_policy patched to install the forward wrapper; the lerobot
      training loop itself is unmodified.
  normalizer_disclosure: >-
    LeRobot replaces checkpoint normalization statistics with target-dataset
    statistics for k>0; all arms share the same k=1 statistics per task.

evaluation:
  suite: libero_goal
  tasks: [0, 1, 2]
  action_steps: [50]
  episodes_per_point: 20
  batch_size: 1
  horizon: 300
  environment_seed: 1000 + episode_index
  policy_noise_seed: 1000 + episode_index
  libero_init_state_id: episode_index
  noise_protocol: reset torch and all CUDA RNGs immediately before each single-episode eval_policy call
  init_state_protocol: set LIBERO init_state_id immediately before each single-episode eval_policy call
  determinism_gate: >-
    replay task 0 / alpha 0.00 in reverse episode order at n=50 and require
    identical per-episode init-state IDs, seeds, outcomes, and rewards
  videos: all episodes are retained
  seed_parity: >-
    identical to the expert-only repro, full-FT, and LoRA experiments
    (training seed 1000; env/noise banks 1000..1019; init states 0..19), so
    the alpha=0.00 arm is directly comparable to full-FT k=1 / n=50
    (2/20, 19/20, 14/20).

known_limitations:
  single_adaptation_seed: one training seed (1000); two-seed requirement outstanding.
  k1_only: >-
    the sweep probes only k=1; a positive result does not automatically
    transfer to k=2/3.
  rerun_control: >-
    alpha=0.00 is a GPU re-run of the full-FT k=1 recipe, not a file copy;
    small deviations from the full-FT numbers measure training-side GPU
    nondeterminism, not a protocol difference.

output_root: /var/tmp/vla_outputs/state_noise_k1_20260822_224355
