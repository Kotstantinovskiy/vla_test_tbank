[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-smolvla-naive-baseline-few-shot-tune"
version = "0.1.0"
description = "Few-shot cost curve (k=5/10/25) on the official-data SmolVLA pretrain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[libero,smolvla]==0.6.1",
  "imageio[ffmpeg]>=2.37,<3",
  "matplotlib>=3.10",
  "PyYAML>=6",
  "torch==2.7.1+cu126",
  "torchcodec==0.5+cu126",
  "torchvision==0.22.1+cu126",
  "trackio==0.33.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
few-shot-prepare = "pretrain_few_shot_tune.prepare:main"
few-shot-selection = "pretrain_few_shot_tune.selection:main"
few-shot-audit = "pretrain_few_shot_tune.audit:main"
few-shot-train = "pretrain_few_shot_tune.training:main"
few-shot-evaluate = "pretrain_few_shot_tune.evaluate:main"
few-shot-orchestrate = "pretrain_few_shot_tune.orchestrate:main"
few-shot-aggregate = "pretrain_few_shot_tune.aggregate:main"
few-shot-trackio = "pretrain_few_shot_tune.trackio_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
